<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDS - Intrusion Detection System | ML-Powered Security</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Monaco', 'Menlo', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #00ff88;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 20px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 0 0 10px #00ff88; }
        .tagline { color: #00ff44; opacity: 0.8; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00ff88;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
        }
        
        .stat-value { font-size: 2em; font-weight: bold; color: #00ff44; }
        .stat-label { color: #00ff88; opacity: 0.7; font-size: 0.9em; margin-top: 10px; }
        
        .controls { margin-bottom: 30px; }
        .btn {
            padding: 12px 20px;
            background: #00ff88;
            color: #0a0e27;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            margin-right: 10px;
        }
        .btn:hover { background: #00ff44; }
        .btn.secondary { background: transparent; border: 1px solid #00ff88; color: #00ff88; }
        
        .alerts-section {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #00ff88;
            border-radius: 5px;
            padding: 20px;
        }
        
        .alert-item {
            background: rgba(0, 30, 60, 0.8);
            border-left: 3px solid #ff6b6b;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 3px;
        }
        
        .alert-item.normal { border-left-color: #00ff88; }
        .alert-item.medium { border-left-color: #ffa94d; }
        .alert-item.high { border-left-color: #ff6b6b; }
        
        .severity { font-weight: bold; font-size: 0.9em; }
        .severity.high { color: #ff6b6b; }
        .severity.medium { color: #ffa94d; }
        .severity.low { color: #00ff88; }
        
        .timestamp { color: #00ff88; opacity: 0.6; font-size: 0.8em; }
        .no-alerts { color: #00ff88; opacity: 0.5; text-align: center; padding: 20px; }
        
        .status { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .status.success { background: rgba(0, 255, 68, 0.1); border: 1px solid #00ff44; color: #00ff44; }
        .status.error { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff4444; }
        .status.info { background: rgba(0, 136, 255, 0.1); border: 1px solid #0088ff; color: #0088ff; }
        
        .loading { text-align: center; }
        .spinner {
            display: inline-block;
            width: 30px; height: 30px;
            border: 2px solid #00ff88;
            border-top: 2px solid #00ff44;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ INTRUSION DETECTION SYSTEM</h1>
            <p class="tagline">ML-Powered Network Anomaly Detection & Threat Analysis</p>
        </header>
        
        <div class="controls">
            <button class="btn" onclick="trainModel()">TRAIN MODEL</button>
            <button class="btn secondary" onclick="analyzeDemo()">ANALYZE DEMO</button>
            <button class="btn secondary" onclick="clearAlerts()">CLEAR ALERTS</button>
        </div>
        
        <div id="status"></div>
        
        <div class="dashboard">
            <div class="card">
                <div class="stat-value" id="totalPackets">0</div>
                <div class="stat-label">Total Packets Analyzed</div>
            </div>
            <div class="card">
                <div class="stat-value" id="anomaliesDetected">0</div>
                <div class="stat-label">Anomalies Detected</div>
            </div>
            <div class="card">
                <div class="stat-value" id="detectionRate">0%</div>
                <div class="stat-label">Detection Rate</div>
            </div>
            <div class="card">
                <div class="stat-value" id="modelStatus">Not Trained</div>
                <div class="stat-label">Model Status</div>
            </div>
        </div>
        
        <div class="alerts-section">
            <h2 style="margin-bottom: 20px; color: #00ff44;">RECENT ALERTS & DETECTIONS</h2>
            <div id="alertsList" class="no-alerts">No alerts yet. Train model and run analysis.</div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://127.0.0.1:5002';
        
        function showStatus(message, type) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = `status ${type}`;
            el.style.display = message ? 'block' : 'none';
        }
        
        function updateStats() {
            fetch(`${API_URL}/api/statistics`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalPackets').textContent = data.total_packets || 0;
                    document.getElementById('anomaliesDetected').textContent = data.anomalies_detected || 0;
                    document.getElementById('detectionRate').textContent = 
                        ((data.detection_rate || 0) * 100).toFixed(2) + '%';
                });
        }
        
        function updateModelStatus() {
            fetch(`${API_URL}/api/model/info`)
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('modelStatus');
                    if (data.status === 'trained') {
                        el.textContent = '✓ Ready';
                        el.style.color = '#00ff44';
                    } else {
                        el.textContent = 'Not Trained';
                        el.style.color = '#ff6b6b';
                    }
                });
        }
        
        function trainModel() {
            showStatus('Training model...', 'info');
            document.getElementById('alertsList').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            fetch(`${API_URL}/api/model/train`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    showStatus(`✓ Model trained! Accuracy: ${(data.accuracy * 100).toFixed(2)}%`, 'success');
                    updateModelStatus();
                    document.getElementById('alertsList').innerHTML = '<div class="no-alerts">Model trained successfully. Ready for analysis.</div>';
                })
                .catch(e => showStatus(`Error: ${e.message}`, 'error'));
        }
        
        function analyzeDemo() {
            const demoTraffic = [
                {
                    name: 'Normal Web Traffic',
                    features: {
                        packet_size: 512, packets_per_sec: 45, protocol_ratio_tcp: 0.6,
                        protocol_ratio_udp: 0.2, dst_port_variance: 3, src_port_variety: 8,
                        connection_duration: 4.5, failed_connection_rate: 0.05,
                        payload_entropy: 6.0, port_scanning_score: 0.1,
                        syn_flood_indicator: 0.05, dns_query_rate: 4
                    }
                },
                {
                    name: 'Port Scanning Attack',
                    features: {
                        packet_size: 200, packets_per_sec: 600, protocol_ratio_tcp: 0.95,
                        protocol_ratio_udp: 0.05, dst_port_variance: 250, src_port_variety: 60,
                        connection_duration: 0.3, failed_connection_rate: 0.8,
                        payload_entropy: 2.0, port_scanning_score: 0.9,
                        syn_flood_indicator: 0.6, dns_query_rate: 35
                    }
                },
                {
                    name: 'DDoS Attack',
                    features: {
                        packet_size: 128, packets_per_sec: 1000, protocol_ratio_tcp: 1.0,
                        protocol_ratio_udp: 0.0, dst_port_variance: 10, src_port_variety: 80,
                        connection_duration: 0.1, failed_connection_rate: 0.9,
                        payload_entropy: 1.5, port_scanning_score: 0.7,
                        syn_flood_indicator: 0.95, dns_query_rate: 2
                    }
                }
            ];
            
            let html = '';
            demoTraffic.forEach(traffic => {
                const data = { features: traffic.features };
                fetch(`${API_URL}/api/detection/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(r => r.json())
                .then(alert => {
                    const severity = alert.severity.toLowerCase();
                    const statusText = alert.is_attack ? '⚠️ THREAT DETECTED' : '✓ NORMAL';
                    html = `
                        <div class="alert-item ${severity}">
                            <div><strong>${traffic.name}</strong> - ${statusText}</div>
                            <div class="severity ${severity}">${alert.severity} (${(alert.attack_probability*100).toFixed(1)}%)</div>
                            <div class="timestamp">${new Date(alert.timestamp).toLocaleString()}</div>
                        </div>
                    ` + (document.getElementById('alertsList').innerHTML || '');
                    document.getElementById('alertsList').innerHTML = html;
                    updateStats();
                });
            });
            
            showStatus('Analyzing demo traffic...', 'info');
        }
        
        function clearAlerts() {
            document.getElementById('alertsList').innerHTML = '<div class="no-alerts">Alerts cleared.</div>';
        }
        
        // Initialize
        updateModelStatus();
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
